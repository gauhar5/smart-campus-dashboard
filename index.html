<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Smart Campus Room Comfort and Energy Dashboard</title>
<style>:root{--bg:#f5f7fa;--card:#fff;--tx:#1b2733;--mu:#5b6b7a;--ac:#1F4E78;--bd:#d6dde5;--bad:#b3261e;--ok:#2e7d32;--warn:#fff2cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181f;--card:#1b242d;--tx:#e8eef4;--mu:#9fb0c0;--ac:#6fb1e6;--bd:#2e3b48;--bad:#ff8a80;--ok:#81c784;--warn:#3d3519}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Arial,sans-serif}html{scroll-padding-top:env(safe-area-inset-top,0px)}
header{background:var(--ac);color:#fff;padding:12px 16px}header b{font-size:17px}header small{display:block;opacity:.85}
nav{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap}nav button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}nav button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:0 16px 32px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.kp .card{margin:0}.kp small{color:var(--mu)}.kp b{font-size:26px;display:block}
h2{margin:8px 0 10px;font-size:19px}label{display:block;font-weight:600;margin:10px 0 3px}input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px;margin-right:6px}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.err{color:var(--bad);font-weight:600;margin-top:10px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu)}tr.c{cursor:pointer}tr.c:hover{background:var(--warn)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}.bar span{width:105px;font-size:13px}.bar i{display:block;height:16px;background:var(--ac);border-radius:4px}.tag{padding:2px 8px;border-radius:10px;background:var(--warn);font-size:12px}.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok);font-weight:600}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;margin:0}dt{color:var(--mu)}dd{margin:0;font-weight:600}.hide{display:none}@media(min-width:900px){main{max-width:1100px}header,nav{padding-left:calc((100vw - 1100px)/2 + 16px);padding-right:16px}.kp{grid-template-columns:repeat(4,1fr)}.dg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dg .card{margin:0}.fm{max-width:640px}th,td{padding:9px 12px}table{font-size:14px}}</style></head><body>
<header><b>Smart Campus Room Comfort and Energy Dashboard</b></header>
<nav id="nav"></nav><main id="app"></main>

20,0,0.63],[27,"B-301","Meeting Room","Block B","2026-10-14","09:00",21.3,57,483,8,1.09],[28,"D-001","Study Space","Block D","2026-10-14","09:00",23.8,46,710,30,2.64],[29,"D-210","Meeting Room","Block D","2026-10-14","09:00",24.3,54,457,4,0.84],[30,"E-305","Lecture Hall","Block E","2026-10-14","09:00",24.6,51,641,36,5.19],[31,"A-205","Classroom","Block A","2026-10-14","13:00",21.5,42,646,21,2.24],[32,"C-206","Computer Lab","Block C","2026-10-14","13:00",22.9,50,741,25,3.71],[33,"C-310","Computer Lab","Block C","2026-10-14","13:00",21.6,44,546,14,3.36],[34,"A-102","Lecture Hall","Block A","2026-10-14","18:00",21.8,41,497,10,4.5],[35,"B-301","Meeting Room","Block B","2026-10-14","18:00",23.6,34,420,0,0.23],[36,"C-310","Computer Lab","Block C","2026-10-14","18:00",22.6,55,420,0,0.58],[37,"E-120","Classroom","Block E","2026-10-14","18:00",24.3,56,488,8,2.08],[38,"A-101","Lecture Hall","Block A","2026-10-15","09:00",23.6,57,420,0,8.58],[39,"A-205","Classroom","Block A","2026-10-15","09:00",24.1,35,506,12,1.82],[40,"B-110","Classroom","Block B","2026-10-15","09:00",21.4,49,692,13,1.95],[41,"B-214","Classroom","Block B","2026-10-15","09:00",21.3,38,632,21,2.39],[42,"C-206","Computer Lab","Block C","2026-10-15","09:00",22.7,54,611,8,3.54],[43,"D-210","Meeting Room","Block D","2026-10-15","09:00",23.3,53,511,9,1.46],[44,"A-205","Classroom","Block A","2026-10-15","13:00",22.8,38,518,12,2.17],[45,"B-214","Classroom","Block B","2026-10-15","13:00",21.3,44,532,12,1.97],[46,"C-204","Computer Lab","Block C","2026-10-15","13:00",21.6,35,420,0,7.49],[47,"A-101","Lecture Hall","Block A","2026-10-15","18:00",23.4,42,420,0,8.78],[48,"A-102","Lecture Hall","Block A","2026-10-15","18:00",21.1,50,420,0,0.89],[49,"B-301","Meeting Room","Block B","2026-10-15","18:00",24.5,55,420,0,0.21],[50,"D-105","Study Space","Block D","2026-10-15","18:00",23.9,43,515,10,2.53],[51,"E-120","Classroom","Block E","2026-10-15","18:00",21.2,57,420,0,0.49],[52,"E-305","Lecture Hall","Block E","2026-10-15","18:00",21.4,47,420,0,1.05],[53,"A-101","Lecture Hall","Block A","2026-10-16","09:00",24.9,40,514,10,4.27],[54,"B-110","Classroom","Block B","2026-10-16","09:00",22.7,55,663,18,2.24],[55,"C-204","Computer Lab","Block C","2026-10-16","09:00",23.3,47,420,0,7.46],[56,"C-206","Computer Lab","Block C","2026-10-16","09:00",21.6,38,629,13,3.63],[57,"D-001","Study Space","Block D","2026-10-16","09:00",22.9,48,420,0,4.79],[58,"E-120","Classroom","Block E","2026-10-16","09:00",24.4,41,550,12,1.71],[59,"D-105","Study Space","Block D","2026-10-16","13:00",24.4,36,547,13,2.42],[60,"C-204","Computer Lab","Block C","2026-10-16","18:00",23.3,34,420,0,6.99]],AL={"2":["Temperature Out of Range","Low","Resolved","Thermostat recalibrated","Madina Askar"],"3":["Idle Energy Waste","High","Open","Schedule adjusted","Aruzhan Kairat"],"5":["High CO2","Medium","In Progress","Window sensor checked","Aigerim Nurlan"],"9":["Temperature Out of Range","Low","Resolved","HVAC filter replaced","Nurlan Omar"],"10":["Idle Energy Waste","High","Resolved","Schedule adjusted","Saltanat Ruslan"],"11":["Idle Energy Waste","High","Open","Lights and HVAC switched off","Yerlan Bekov"],"14":["Idle Energy Waste","High","In Progress","Lights and HVAC switched off","Aruzhan Kairat"],"15":["High CO2","High","Resolved","Ventilation increased","Nurlan Omar"],"16":["Temperature Out of Range","Low","Resolved","HVAC filter replaced","Aigerim Nurlan"],"19":["High CO2","High","Open","Ventilation increased","Dana Sagyn"],"38":["Idle Energy Waste","High","In Progress","Schedule adjusted","Timur Aliyev"],"46":["Idle Energy Waste","High","Resolved","Timer installed","Saltanat Ruslan"],"47":["Idle Energy Waste","High","Resolved","Lights and HVAC switched off","Yerlan Bekov"],"55":["Idle Energy Waste","High","Open","Lights and HVAC switched off","Saltanat Ruslan"],"57":["Idle Energy Waste","High","In Progress","Schedule adjusted","Daulet Serik"],"60":["Idle Energy Waste","High","Resolved","Lights and HVAC switched off","Daulet Serik"]},ROOMS=["A-101", "A-102", "A-205", "B-110", "B-214", "B-301", "C-204", "C-206", "C-310", "D-001", "D-105", "D-210", "E-120", "E-305"],T={tmin:20,tmax:25,co2:1000,idle:2};
const S={view:"dashboard",sel:null,err:"",last:null,q:""};
const comfort=r=>r[6]>=T.tmin&&r[6]<=T.tmax&&r[8]<T.co2?"Comfortable":"Uncomfortable";
const eff=r=>r[9]==0&&r[10]>=T.idle?"Inefficient":r[9]==0?"Idle - normal":"In use";
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0, f2=x=>(Math.round(x*100)/100).toFixed(2);
const $=s=>document.getElementById(s);
function go(v,sel){S.view=v;if(sel!==undefined)S.sel=sel;S.err="";render();window.scrollTo(0,0)}
function nav(){const t=[["dashboard","Dashboard"],["new","Add reading"],["list","Records"]];$("nav").innerHTML=t.map(a=>`<button class="${S.view==a[0]?"on":""}" onclick="go('${a[0]}')">${a[1]}</button>`).join("")}
function dash(){const n=R.length,i1=R.filter(r=>eff(r)=="Inefficient").length,lh=avg(R.filter(r=>r[2]=="Lecture Hall").map(r=>r[10])),unc=R.filter(r=>comfort(r)=="Uncomfortable").length/n*100,mx=R.reduce((a,b)=>b[10]>a[10]?b:a);
const ty=[...new Set(R.map(r=>r[2]))].map(t=>[t,avg(R.filter(r=>r[2]==t).map(r=>r[10]))]).sort((a,b)=>b[1]-a[1]),m=ty[0][1];
const rm=ROOMS.map(c=>[c,R.filter(r=>r[1]==c&&eff(r)=="Inefficient").length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
return `<h2>Dashboard</h2><div class="kp"><div class="card"><small>I1 Inefficient readings</small><b>${i1}</b><small>empty room, ≥ ${T.idle} kWh</small></div><div class="card"><small>I2 Avg Lecture Hall energy</small><b>${f2(lh)} kWh</b></div><div class="card"><small>I3 Uncomfortable readings</small><b>${f2(unc)}%</b></div><div class="card"><small>I4 Peak energy reading</small><b>${mx[10]} kWh</b><small>room ${mx[1]}</small></div></div>
<div class="dg" style="margin:12px 0"><div class="card"><b>Average energy per reading by room type (kWh)</b>${ty.map(x=>`<div class="bar"><span>${x[0]}</span><i style="width:${x[1]/m*60}%"></i>${f2(x[1])}</div>`).join("")}</div>
<div class="card"><b>Rooms needing attention</b>${rm.map(x=>`<div class="bar"><span>${x[0]}</span><span class="tag">${x[1]} inefficient readings</span></div>`).join("")}</div></div>
<button class="btn" onclick="go('new')">Add reading</button><button class="btn g" onclick="go('list')">View records</button>`}
function form(){return `<h2>Add room reading</h2><div class="card fm"><label>room_code</label><select id="f_room"><option value="">Select room…</option>${ROOMS.map(c=>`<option>${c}</option>`).join("")}</select>
<div class="row2"><div><label>reading_date</label><input id="f_date" type="date" value="2026-10-19"></div><div><label>reading_time</label><input id="f_time" type="time" value="09:00"></div></div>
<div class="row2"><div><label>temperature_c</label><input id="f_t" type="number" step="0.1" placeholder="22.5"></div><div><label>humidity_pct</label><input id="f_h" type="number" placeholder="45"></div></div>
<div class="row2"><div><label>co2_ppm</label><input id="f_c" type="number" placeholder="650"></div><div><label>occupancy_count</label><input id="f_o" type="number" placeholder="0"></div></div>
<label>energy_kwh</label><input id="f_e" type="number" step="0.01" placeholder="2.40">
${S.err?`<div class="err">⚠ ${S.err}</div>`:""}<button class="btn" onclick="save()">Save reading</button><button class="btn g" onclick="go('dashboard')">Cancel</button></div>`}
function save(){const g=i=>$(i).value,v={room:g("f_room"),d:g("f_date"),t:g("f_time"),te:g("f_t"),h:g("f_h"),c:g("f_c"),o:g("f_o"),e:g("f_e")};
if(!v.room||!v.d||!v.t||[v.te,v.h,v.c,v.o,v.e].some(x=>x===""))return err("All fields are required. Please complete every field.");
if(+v.o<0||+v.e<0||+v.te<5||+v.te>40||+v.h<0||+v.h>100||+v.c<250)return err("Invalid value: check temperature (5–40 °C), humidity (0–100 %), CO2 (≥ 250 ppm), occupancy and energy (≥ 0).");
const base=R.find(r=>r[1]==v.room),row=[Math.max(...R.map(r=>r[0]))+1,v.room,base[2],base[3],v.d,v.t,+v.te,+v.h,+v.c,+v.o,+v.e];R.push(row);S.last=row;go("done")}
function err(m){const keep=["f_room","f_date","f_time","f_t","f_h","f_c","f_o","f_e"].map(i=>$(i).value);S.err=m;render();["f_room","f_date","f_time","f_t","f_h","f_c","f_o","f_e"].forEach((i,k)=>$(i).value=keep[k])}
function list(){const rows=R.filter(r=>!S.q||r[1]==S.q).slice().reverse();return `<h2>Reading records (${rows.length})</h2><div class="card"><label>Filter by room_code</label><select onchange="S.q=this.value;render()"><option value="">All rooms</option>${ROOMS.map(c=>`<option ${S.q==c?"selected":""}>${c}</option>`).join("")}</select></div>
<div class="card scroll"><table><tr><th>reading_id</th><th>room_code</th><th>reading_date</th><th>occupancy_count</th><th>energy_kwh</th><th>status</th></tr>${rows.map(r=>`<tr class="c" onclick="go('detail',${r[0]})"><td>${r[0]}</td><td>${r[1]}</td><td>${r[4]}</td><td>${r[9]}</td><td>${r[10]}</td><td class="${eff(r)=="Inefficient"?"bad":""}">${eff(r)}</td></tr>`).join("")}</table></div>`}
function detail(){const r=R.find(x=>x[0]==S.sel),a=AL[r[0]];return `<h2>Reading ${r[0]} · ${r[1]}</h2><div class="card"><dl><dt>room_code</dt><dd>${r[1]}</dd><dt>room_type</dt><dd>${r[2]}</dd><dt>building_block</dt><dd>${r[3]}</dd><dt>reading_date / time</dt><dd>${r[4]} ${r[5]}</dd><dt>temperature_c</dt><dd>${r[6]}</dd><dt>humidity_pct</dt><dd>${r[7]}</dd><dt>co2_ppm</dt><dd>${r[8]}</dd><dt>occupancy_count</dt><dd>${r[9]}</dd><dt>energy_kwh</dt><dd>${r[10]}</dd><dt>comfort_status</dt><dd class="${comfort(r)=="Comfortable"?"ok":"bad"}">${comfort(r)}</dd><dt>efficiency_status</dt><dd class="${eff(r)=="Inefficient"?"bad":""}">${eff(r)}</dd></dl></div>
<div class="card"><b>Alert</b><br>${a?`${a[0]} · severity ${a[1]} · ${a[2]}<br>Action: ${a[3]} (assigned to ${a[4]})`:"No alert linked to this reading."}</div><button class="btn g" onclick="go('list')">Back to records</button>`}
function done(){const r=S.last;return `<h2>Reading saved</h2><div class="card"><div class="ok" style="font-size:18px">✓ Reading ${r[0]} for room ${r[1]} was saved.</div><p>Status: <b>${comfort(r)}</b> · <b>${eff(r)}</b>. The dashboard indicators have been updated.</p></div><button class="btn" onclick="go('detail',${r[0]})">View details</button><button class="btn g" onclick="go('dashboard')">Back to dashboard</button>`}
function render(){nav();$("app").innerHTML={dashboard:dash,new:form,list:list,detail:detail,done:done}[S.view]()}
render();
</script></body></html>
